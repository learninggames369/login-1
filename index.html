<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Scholars</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
  /* Layout: a two-panel "storybook" - a sky-and-mascot illustration on the left, a soft card with the login form on the right; stacked on phones. */
  :root {
    --sky-top: #FFE7B3;
    --sky-bottom: #FFC9A6;
    --cream: #FFF5E4;
    --card: #FFFFFF;
    --ink: #2A2142;
    --ink-soft: #6B6482;
    --line: #F0E1CF;
    --field: #FFF9EF;
    --coral: #FF7A59;
    --coral-deep: #E85C3C;
    --sun: #FFC43D;
    --grass: #4CC38A;
    --sky: #6FC3FF;
    --violet: #B084F3;
    --pink: #FFB1C8;
    --shadow: 0 18px 40px -22px rgba(42, 33, 66, 0.35);
    --shadow-btn: 0 10px 0 -2px var(--coral-deep);

    --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sky-top: #3A2E66;
      --sky-bottom: #5C3E7A;
      --cream: #1E183A;
      --card: #28214A;
      --ink: #FFF2DC;
      --ink-soft: #B9B0D4;
      --line: #3A3268;
      --field: #221C40;
      --coral: #FF8A6C;
      --coral-deep: #D14A2C;
      --sun: #FFD15C;
      --grass: #6FD99F;
      --sky: #7FC9FF;
      --violet: #C6A4FF;
      --pink: #FFC2D4;
      --shadow: 0 18px 44px -18px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sky-top: #3A2E66;
    --sky-bottom: #5C3E7A;
    --cream: #1E183A;
    --card: #28214A;
    --ink: #FFF2DC;
    --ink-soft: #B9B0D4;
    --line: #3A3268;
    --field: #221C40;
    --coral: #FF8A6C;
    --coral-deep: #D14A2C;
    --sun: #FFD15C;
    --grass: #6FD99F;
    --sky: #7FC9FF;
    --violet: #C6A4FF;
    --pink: #FFC2D4;
    --shadow: 0 18px 44px -18px rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--cream);
    min-height: 100%;
    overflow-x: hidden;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }

  .stage {
    min-height: 100%;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(20px, 3vw, 44px);
  }

  /* -------- LEFT: sky scene -------- */
  .scene {
    position: relative;
    border-radius: 36px;
    background: linear-gradient(170deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    overflow: hidden;
    padding: 36px 32px;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: var(--shadow);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
    z-index: 3;
  }
  .brand-mark {
    width: 52px; height: 52px;
    border-radius: 16px;
    background: var(--card);
    display: grid; place-items: center;
    box-shadow: 0 6px 0 -1px rgba(42,33,66,0.12);
  }
  .brand-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.2px;
    color: var(--ink);
  }
  .brand-name span { color: var(--coral-deep); }

  .headline {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(32px, 4.4vw, 52px);
    line-height: 1.02;
    color: var(--ink);
    margin: 6px 0 0;
    text-wrap: balance;
    position: relative;
    z-index: 3;
    max-width: 14ch;
  }
  .headline em {
    font-style: normal;
    color: var(--coral-deep);
    position: relative;
  }
  .headline em::after {
    content: "";
    position: absolute;
    left: -2%; right: -2%; bottom: 4%;
    height: 14px;
    background: var(--sun);
    border-radius: 999px;
    z-index: -1;
    opacity: 0.6;
  }
  .sub {
    font-weight: 700;
    color: var(--ink);
    opacity: 0.78;
    font-size: 16px;
    max-width: 36ch;
    position: relative;
    z-index: 3;
  }

  /* fun chips */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 6px;
    position: relative;
    z-index: 3;
  }
  .chip {
    background: var(--card);
    color: var(--ink);
    font-weight: 700;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 0 -1px rgba(42,33,66,0.10);
  }
  .chip-dot {
    width: 10px; height: 10px; border-radius: 50%;
  }

  .scene-art {
    margin-top: auto;
    position: relative;
    display: grid;
    place-items: end center;
  }
  .scene-art svg { width: min(360px, 90%); height: auto; display: block; }

  /* ambient shapes */
  .sprite { position: absolute; pointer-events: none; }
  .s-cloud-1 { top: 10%; right: -20px; width: 150px; animation: drift 14s ease-in-out infinite; }
  .s-cloud-2 { top: 44%; left: -30px; width: 110px; animation: drift 18s ease-in-out infinite reverse; }
  .s-star-1 { top: 22%; right: 20%; width: 28px; animation: twinkle 3.6s ease-in-out infinite; }
  .s-star-2 { top: 60%; right: 10%; width: 22px; animation: twinkle 4.2s ease-in-out infinite 0.6s; }
  .s-star-3 { top: 36%; left: 18%; width: 18px; animation: twinkle 5s ease-in-out infinite 1.1s; }
  .s-balloon { bottom: 30%; left: 10%; width: 60px; animation: float 6s ease-in-out infinite; }

  @keyframes drift {
    0%,100% { transform: translateX(0); }
    50% { transform: translateX(14px); }
  }
  @keyframes twinkle {
    0%,100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(0.75); opacity: 0.55; }
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-14px) rotate(3deg); }
  }
  @keyframes wave {
    0%,100% { transform: rotate(-6deg); }
    50% { transform: rotate(14deg); }
  }
  .owl-wave { transform-origin: 50% 70%; animation: wave 2.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .sprite, .owl-wave { animation: none !important; }
  }

  /* -------- RIGHT: form card -------- */
  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 8px 20px 36px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 32px;
    padding: 32px 30px 28px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    background: var(--field);
    padding: 6px;
    border-radius: 999px;
    margin-bottom: 20px;
  }
  .tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--font-body);
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.3px;
    padding: 12px 14px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background .2s, color .2s, transform .1s;
  }
  .tab[aria-selected="true"] {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 4px 0 -1px rgba(42,33,66,0.10);
  }
  .tab:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .tab svg { width: 18px; height: 18px; }

  .hello {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    margin: 4px 0 2px;
    letter-spacing: 0.2px;
    display: flex; align-items: center; gap: 10px;
  }
  .hello .wave-emoji {
    display: inline-block;
    animation: wave 2.4s ease-in-out infinite;
    transform-origin: 70% 70%;
  }
  .hello-sub {
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 20px;
  }

  form { display: flex; flex-direction: column; gap: 14px; }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .field label {
    font-weight: 800;
    font-size: 13px;
    color: var(--ink);
    padding-left: 4px;
    display: flex; align-items: center; gap: 8px;
  }
  .label-icon {
    width: 16px; height: 16px; color: var(--coral);
  }
  .input-wrap {
    position: relative;
    display: flex; align-items: center;
  }
  .input-wrap input {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--field);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 14px 44px 14px 16px;
    transition: border-color .2s, background .2s;
  }
  .input-wrap input::placeholder { color: var(--ink-soft); font-weight: 600; opacity: 0.75; }
  .input-wrap input:focus,
  .input-wrap select:focus {
    outline: none;
    border-color: var(--coral);
    background: var(--card);
  }
  .input-wrap select {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--field);
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 14px 40px 14px 16px;
    appearance: none;
    cursor: pointer;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%),
      linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position:
      calc(100% - 20px) 50%,
      calc(100% - 14px) 50%;
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    transition: border-color .2s, background-color .2s;
  }
  .field-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .agree {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
    line-height: 1.35;
    padding: 10px 12px;
    background: var(--field);
    border-radius: 14px;
    cursor: pointer;
    margin-top: 2px;
  }
  .agree input {
    appearance: none;
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--line);
    background: var(--card);
    display: grid; place-items: center;
    cursor: pointer;
    margin-top: 1px;
  }
  .agree input:checked {
    background: var(--grass);
    border-color: var(--grass);
  }
  .agree input:checked::after {
    content: "";
    width: 10px; height: 6px;
    border-left: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .input-trail {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    display: grid; place-items: center;
    color: var(--ink-soft);
    background: transparent; border: 0;
    cursor: pointer;
    border-radius: 50%;
  }
  .input-trail:hover { color: var(--coral); }
  .input-trail:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: -2px;
  }
  .remember {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 13px; color: var(--ink);
    cursor: pointer;
  }
  .remember input {
    appearance: none;
    width: 20px; height: 20px;
    border-radius: 6px;
    border: 2px solid var(--line);
    background: var(--field);
    display: grid; place-items: center;
    cursor: pointer;
  }
  .remember input:checked {
    background: var(--grass);
    border-color: var(--grass);
  }
  .remember input:checked::after {
    content: "";
    width: 10px; height: 6px;
    border-left: 2.5px solid #fff;
    border-bottom: 2.5px solid #fff;
    transform: rotate(-45deg) translate(1px, -1px);
  }
  .forgot {
    font-weight: 800; font-size: 13px;
    color: var(--coral-deep);
    text-decoration: none;
    border-bottom: 2px dashed var(--coral);
    padding-bottom: 1px;
  }
  .forgot:hover { color: var(--coral); }
  .forgot:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; border-radius: 4px; }

  .btn {
    margin-top: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.3px;
    color: #fff;
    background: var(--coral);
    border: 0;
    padding: 16px 20px;
    border-radius: 18px;
    cursor: pointer;
    box-shadow: var(--shadow-btn);
    transition: transform .08s ease, box-shadow .08s ease, background .2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn:hover { background: var(--coral-deep); }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 4px 0 -2px var(--coral-deep);
  }
  .btn:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .btn svg { width: 20px; height: 20px; }

  .btn-github {
    margin-top: 10px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.2px;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    padding: 13px 18px;
    border-radius: 16px;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    transition: background .2s, border-color .2s, transform .08s;
  }
  .btn-github:hover { background: var(--field); border-color: var(--ink-soft); }
  .btn-github:active { transform: translateY(1px); }
  .btn-github:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .btn-github svg { width: 20px; height: 20px; }
  :root[data-theme="dark"] .btn-github svg,
  :root:not([data-theme="light"]) .btn-github svg { color: var(--ink); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .btn-github { background: var(--field); }
  }
  :root[data-theme="dark"] .btn-github { background: var(--field); }

  .divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--ink-soft);
    font-weight: 700; font-size: 12px;
    margin: 18px 0 8px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1; height: 2px;
    background: var(--line);
    border-radius: 2px;
  }

  .signup {
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink-soft);
  }
  .signup a {
    color: var(--coral-deep);
    text-decoration: none;
    font-weight: 800;
    margin-left: 4px;
  }
  .signup a:hover { text-decoration: underline; }

  /* badges row at the very bottom of the card */
  .fun-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    justify-content: center;
  }
  .fun {
    width: 36px; height: 36px;
    border-radius: 12px;
    display: grid; place-items: center;
    color: #fff;
  }
  .fun svg { width: 18px; height: 18px; }

  /* ---- Responsive ---- */
  @media (max-width: 900px) {
    .stage { grid-template-columns: 1fr; }
    .panel { padding: 24px 0 8px; }
    .scene { min-height: 360px; padding: 24px 22px; }
    .scene-art svg { width: min(280px, 72%); }
    .s-cloud-1 { width: 110px; }
    .s-cloud-2 { width: 80px; }
    .s-balloon { width: 46px; }
    .headline { font-size: clamp(28px, 7vw, 40px); }
  }
  @media (max-width: 420px) {
    .card { padding: 24px 18px 22px; border-radius: 26px; }
    .scene { border-radius: 28px; }
    .brand-mark { width: 44px; height: 44px; border-radius: 13px; }
    .brand-name { font-size: 20px; }
    .hello { font-size: 24px; }
    .btn { font-size: 16px; padding: 14px 18px; }
  }

  /* welcome page styles live in welcome.html */
</style>

</head>
<body>
<div class="stage" id="view-login">
  <!-- LEFT: illustrated sky panel -->
  <section class="scene" aria-hidden="false">
    <!-- ambient shapes -->
    <svg class="sprite s-cloud-1" viewBox="0 0 120 60" fill="none">
      <ellipse cx="38" cy="40" rx="30" ry="18" fill="#fff" opacity="0.92"/>
      <ellipse cx="72" cy="34" rx="36" ry="22" fill="#fff" opacity="0.92"/>
      <ellipse cx="96" cy="44" rx="20" ry="14" fill="#fff" opacity="0.92"/>
    </svg>
    <svg class="sprite s-cloud-2" viewBox="0 0 120 60" fill="none">
      <ellipse cx="38" cy="40" rx="30" ry="18" fill="#fff" opacity="0.85"/>
      <ellipse cx="72" cy="34" rx="36" ry="22" fill="#fff" opacity="0.85"/>
    </svg>
    <svg class="sprite s-star-1" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 L14.3 9 L21 9.5 L15.7 13.7 L17.8 21 L12 16.8 L6.2 21 L8.3 13.7 L3 9.5 L9.7 9 Z" fill="#FFD15C"/>
    </svg>
    <svg class="sprite s-star-2" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 L14.3 9 L21 9.5 L15.7 13.7 L17.8 21 L12 16.8 L6.2 21 L8.3 13.7 L3 9.5 L9.7 9 Z" fill="#fff"/>
    </svg>
    <svg class="sprite s-star-3" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M12 2 L14.3 9 L21 9.5 L15.7 13.7 L17.8 21 L12 16.8 L6.2 21 L8.3 13.7 L3 9.5 L9.7 9 Z" fill="#B084F3"/>
    </svg>
    <svg class="sprite s-balloon" viewBox="0 0 60 90" fill="none" aria-hidden="true">
      <ellipse cx="30" cy="34" rx="22" ry="28" fill="#FF7A59"/>
      <path d="M26 60 L34 60 L30 66 Z" fill="#E85C3C"/>
      <path d="M30 66 Q30 78 32 86" stroke="#2A2142" stroke-width="1.5" fill="none" opacity="0.5"/>
    </svg>

    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <!-- logo: book + spark -->
        <svg viewBox="0 0 48 48" width="34" height="34" fill="none" aria-hidden="true">
          <path d="M8 12 C 8 10, 10 9, 12 9 L22 9 C 24 9, 25 10, 25 12 L25 38 C25 36, 23 35, 21 35 L12 35 C 10 35, 8 36, 8 38 Z"
                fill="#FF7A59"/>
          <path d="M25 12 C25 10, 26 9, 28 9 L36 9 C 38 9, 40 10, 40 12 L40 38 C 40 36, 38 35, 36 35 L28 35 C 26 35, 25 36, 25 38 Z"
                fill="#FFC43D"/>
          <path d="M34 15 L36 20 L41 21 L37 24 L38 29 L34 26 L30 29 L31 24 L27 21 L32 20 Z" fill="#fff"/>
        </svg>
      </div>
      <div class="brand-name">Little <span>Scholars</span></div>
    </div>

    <h1 class="headline">Hello <em>curious</em> minds!</h1>
    <p class="sub">A friendly place to read, play and discover something new every day.</p>

    <div class="chips" role="list">
      <span class="chip" role="listitem"><span class="chip-dot" style="background:var(--coral)"></span>Read</span>
      <span class="chip" role="listitem"><span class="chip-dot" style="background:var(--grass)"></span>Play</span>
      <span class="chip" role="listitem"><span class="chip-dot" style="background:var(--sky)"></span>Explore</span>
      <span class="chip" role="listitem"><span class="chip-dot" style="background:var(--violet)"></span>Create</span>
    </div>

    <div class="scene-art">
      <!-- Owl mascot with waving wing, sitting on a pencil -->
      <svg viewBox="0 0 320 280" fill="none" aria-hidden="true">
        <!-- ground shadow -->
        <ellipse cx="160" cy="258" rx="110" ry="10" fill="#2A2142" opacity="0.12"/>

        <!-- pencil -->
        <g>
          <rect x="40" y="220" width="240" height="26" rx="6" fill="#FFC43D"/>
          <rect x="40" y="220" width="240" height="8" rx="4" fill="#fff" opacity="0.35"/>
          <polygon points="40,220 20,233 40,246" fill="#F4C8A0"/>
          <polygon points="20,233 28,233 32,238 28,243 20,233" fill="#2A2142"/>
          <rect x="278" y="220" width="18" height="26" rx="4" fill="#FF7A59"/>
          <rect x="296" y="220" width="10" height="26" rx="3" fill="#E85C3C"/>
        </g>

        <!-- body -->
        <ellipse cx="160" cy="150" rx="78" ry="82" fill="#8B6BE3"/>
        <!-- belly -->
        <ellipse cx="160" cy="170" rx="52" ry="58" fill="#FFE7B3"/>
        <!-- feet -->

        <path d="M180 222 Q180 232 172 234 M190 222 Q190 234 198 234 M188 222 L188 232" stroke="#FF9F3B" stroke-width="5" stroke-linecap="round" fill="none"/>

        <!-- ear tufts -->
        <path d="M100 86 L112 70 L120 92 Z" fill="#8B6BE3"/>
        <path d="M220 86 L208 70 L200 92 Z" fill="#8B6BE3"/>

        <!-- eyes bg -->
        <circle cx="134" cy="128" r="30" fill="#fff"/>
        <circle cx="186" cy="128" r="30" fill="#fff"/>
        <!-- pupils -->
        <circle cx="140" cy="132" r="14" fill="#2A2142"/>
        <circle cx="192" cy="132" r="14" fill="#2A2142"/>
        <!-- sparkle -->
        <circle cx="145" cy="126" r="4" fill="#fff"/>
        <circle cx="197" cy="126" r="4" fill="#fff"/>
        <circle cx="133" cy="137" r="2" fill="#fff"/>
        <circle cx="185" cy="137" r="2" fill="#fff"/>

        <!-- beak -->

        <!-- cheek blush -->
        <ellipse cx="112" cy="168" rx="10" ry="6" fill="#FFB1C8" opacity="0.8"/>
        <ellipse cx="208" cy="168" rx="10" ry="6" fill="#FFB1C8" opacity="0.8"/>

        <!-- static wing (left) -->

        <!-- waving wing (right) -->
        <g class="owl-wave" style="transform-box: fill-box;">
          <path d="M226 152 Q252 128 262 100 Q244 92 224 118 Q214 134 226 152 Z" fill="#6E54C4"/>
          <path d="M232 146 Q252 128 258 108" stroke="#8B6BE3" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>

        <!-- graduation cap -->
        <g>
          <polygon points="160,60 110,80 160,100 210,80" fill="#2A2142"/>

          <path d="M210 80 L210 102 Q180 112 160 100" stroke="#2A2142" stroke-width="4" fill="none"/>
          <circle cx="210" cy="104" r="4" fill="#FFC43D"/>

      </svg>
    </div>
  </section>

  <!-- RIGHT: form -->
  <section class="panel">
    <div class="card" role="region" aria-label="Sign in">
      <div class="tabs" role="tablist" aria-label="Who is signing in">
        <button class="tab" role="tab" aria-selected="true" aria-controls="form-student" data-role="student">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 10 L12 5 L21 10 L12 15 Z" fill="currentColor"/>
            <path d="M7 12.5 V16 C7 16 9 18 12 18 C15 18 17 16 17 16 V12.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
          </svg>
          Student
        </button>
        <button class="tab" role="tab" aria-selected="false" aria-controls="form-parent" data-role="parent">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="9" cy="8" r="3.2" fill="currentColor"/>
            <circle cx="16" cy="9" r="2.6" fill="currentColor"/>
            <path d="M3 19 C3 15.5 6 14 9 14 C12 14 15 15.5 15 19 Z" fill="currentColor"/>
            <path d="M14 19 C14 16.8 15.8 15.4 18 15.4 C20.2 15.4 22 16.8 22 19 Z" fill="currentColor"/>

          Parent
        </button>

      <div class="hello">
        <span id="hello-title">Welcome back!</span>
        <span class="wave-emoji" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none">
            <path d="M6 13 L6 8 Q6 6 8 6 Q10 6 10 8 L10 11 L10 6 Q10 4 12 4 Q14 4 14 6 L14 11 L14 7 Q14 5 16 5 Q18 5 18 7 L18 12 Q18 14 17 15 L17 15 Q16 16 15.5 17 Q15 18 15 19 C15 19 14 20 12 20 C9 20 7 18.5 6 16 Q5 14 6 13 Z" fill="#FFC43D" stroke="#2A2142" stroke-width="1.2"/>
          </svg>
        </span>
      </div>
      <div class="hello-sub" id="hello-sub">Sign in to keep learning and earning stars.</div>

      <form id="form-student" novalidate autocomplete="on">
        <div class="field">
          <label for="login-id">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="4" fill="currentColor"/>
              <path d="M4 20 C4 16 7.5 14 12 14 C16.5 14 20 16 20 20 Z" fill="currentColor"/>
            </svg>
            Username or mobile
          </label>
          <div class="input-wrap">
            <input id="login-id" name="login-id" type="text" inputmode="text"
                   placeholder="eg. sunny_8 or 98765 43210"
                   autocomplete="username" required aria-describedby="login-id-hint"/>
          </div>
        </div>

        <div class="field">
          <label for="password">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2.5" fill="currentColor"/>
              <path d="M8 10 V7 A4 4 0 0 1 16 7 V10" stroke="currentColor" stroke-width="2.2" fill="none"/>
              <circle cx="12" cy="15" r="1.6" fill="#fff"/>
            </svg>
            Password
          </label>
          <div class="input-wrap">
            <input id="password" name="password" type="password"
                   placeholder="Your secret word"
                   autocomplete="current-password" required minlength="4"/>
            <button class="input-trail" type="button" id="toggle-pw" aria-label="Show password" aria-pressed="false">
              <svg id="eye" viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true">
                <path d="M2 12 C 5 6, 9 4, 12 4 C 15 4, 19 6, 22 12 C 19 18, 15 20, 12 20 C 9 20, 5 18, 2 12 Z" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" id="remember" name="remember" checked/>
            Remember me
          </label>
          <a class="forgot" href="#forgot" id="forgot-link">Forgot password?</a>
        </div>

        <button class="btn" type="submit">
          Let's go
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12 H19 M14 6 L20 12 L14 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="btn-github" type="button" id="github-login" aria-label="Sign in with GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 1.5 C 6.2 1.5 1.5 6.2 1.5 12 c 0 4.65 3 8.6 7.15 10 .52.1.72-.22.72-.5 0-.25-.01-.9-.01-1.78-2.9.63-3.52-1.4-3.52-1.4-.48-1.2-1.17-1.52-1.17-1.52-.95-.65.07-.64.07-.64 1.06.08 1.62 1.08 1.62 1.08.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.67-1.4-2.32-.27-4.76-1.16-4.76-5.15 0-1.14.4-2.07 1.08-2.8-.11-.26-.47-1.32.1-2.75 0 0 .88-.28 2.88 1.07a10 10 0 0 1 2.62-.35c.89 0 1.78.12 2.62.35 2-1.35 2.88-1.07 2.88-1.07.57 1.43.2 2.49.1 2.75.67.73 1.08 1.66 1.08 2.8 0 4-2.44 4.88-4.77 5.14.38.33.72.96.72 1.94 0 1.4-.01 2.53-.01 2.87 0 .28.2.6.73.5A10.5 10.5 0 0 0 22.5 12 c 0-5.8-4.7-10.5-10.5-10.5 Z"/>
          </svg>
          Sign in with GitHub
        </button>

        <div class="divider">OR</div>

        <div class="signup">
          New student?
          <a href="#signup" id="signup-link">Create your account</a>
        </div>
      </form>

      <!-- SIGN UP FORM (hidden by default) -->
      <form id="form-signup" novalidate autocomplete="on" hidden>
        <div class="field">
          <label for="su-name">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="8" r="4" fill="currentColor"/>
              <path d="M4 20 C4 16 7.5 14 12 14 C16.5 14 20 16 20 20 Z" fill="currentColor"/>
            </svg>
            Full name
          </label>
          <div class="input-wrap">
            <input id="su-name" name="full-name" type="text" placeholder="eg. Ananya Kapoor"
                   autocomplete="name" required minlength="2"/>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="su-username">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6 H20 V14 H13 L10 17 L10 14 H4 Z" fill="currentColor"/>
              </svg>
              Username
            </label>
            <div class="input-wrap">
              <input id="su-username" name="username" type="text" placeholder="sunny_8"
                     autocomplete="username" required minlength="3" pattern="[A-Za-z0-9_]+"/>
            </div>
          </div>

          <div class="field">
            <label for="su-class">
              <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 6 L12 3 L20 6 L12 9 Z" fill="currentColor"/>
                <path d="M6 8 V13 C6 14.5 9 16 12 16 C15 16 18 14.5 18 13 V8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
              </svg>
              Class
            </label>
            <div class="input-wrap">
              <select id="su-class" name="class" required>
                <option value="" disabled selected>Choose</option>
                <option>Class 1</option><option>Class 2</option><option>Class 3</option>
                <option>Class 4</option><option>Class 5</option><option>Class 6</option>
                <option>Class 7</option><option>Class 8</option>
              </select>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="su-mobile">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="7" y="2.5" width="10" height="19" rx="3" fill="currentColor"/>
              <rect x="10.5" y="18" width="3" height="1.5" rx="0.5" fill="#fff"/>
            </svg>
            Parent's mobile number
          </label>
          <div class="input-wrap">
            <input id="su-mobile" name="mobile" type="tel" inputmode="numeric"
                   placeholder="98765 43210"
                   autocomplete="tel" required pattern="[0-9 +\-]{10,}"/>
          </div>
        </div>

        <div class="field">
          <label for="su-password">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="10" width="14" height="10" rx="2.5" fill="currentColor"/>
              <path d="M8 10 V7 A4 4 0 0 1 16 7 V10" stroke="currentColor" stroke-width="2.2" fill="none"/>
              <circle cx="12" cy="15" r="1.6" fill="#fff"/>
            </svg>
            Create a password
          </label>
          <div class="input-wrap">
            <input id="su-password" name="new-password" type="password"
                   placeholder="At least 4 letters or numbers"
                   autocomplete="new-password" required minlength="4"/>
            <button class="input-trail" type="button" id="toggle-su-pw" aria-label="Show password" aria-pressed="false">
              <svg id="su-eye" viewBox="0 0 24 24" fill="none" width="18" height="18" aria-hidden="true">
                <path d="M2 12 C 5 6, 9 4, 12 4 C 15 4, 19 6, 22 12 C 19 18, 15 20, 12 20 C 9 20, 5 18, 2 12 Z" stroke="currentColor" stroke-width="2" fill="none"/>
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <label class="agree">
          <input type="checkbox" id="su-agree" required/>
          <span>I promise to learn, be kind, and let a grown-up help when I need it.</span>
        </label>

        <button class="btn" type="submit">
          Create my account
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12 L10 17 L20 7" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="btn-github" type="button" id="github-signup" aria-label="Sign up with GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M12 1.5 C 6.2 1.5 1.5 6.2 1.5 12 c 0 4.65 3 8.6 7.15 10 .52.1.72-.22.72-.5 0-.25-.01-.9-.01-1.78-2.9.63-3.52-1.4-3.52-1.4-.48-1.2-1.17-1.52-1.17-1.52-.95-.65.07-.64.07-.64 1.06.08 1.62 1.08 1.62 1.08.94 1.6 2.46 1.14 3.06.87.1-.68.37-1.14.67-1.4-2.32-.27-4.76-1.16-4.76-5.15 0-1.14.4-2.07 1.08-2.8-.11-.26-.47-1.32.1-2.75 0 0 .88-.28 2.88 1.07a10 10 0 0 1 2.62-.35c.89 0 1.78.12 2.62.35 2-1.35 2.88-1.07 2.88-1.07.57 1.43.2 2.49.1 2.75.67.73 1.08 1.66 1.08 2.8 0 4-2.44 4.88-4.77 5.14.38.33.72.96.72 1.94 0 1.4-.01 2.53-.01 2.87 0 .28.2.6.73.5A10.5 10.5 0 0 0 22.5 12 c 0-5.8-4.7-10.5-10.5-10.5 Z"/>
          </svg>
          Sign up with GitHub
        </button>

        <div class="divider">OR</div>

        <div class="signup">
          Already have an account?
          <a href="#login" id="back-to-login">Back to login</a>
        </div>
      </form>

      <div class="fun-row" aria-hidden="true" title="Earn stars by learning every day">
          <span class="fun" style="background:var(--coral)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 L14 10 L21 10.5 L15.5 15 L17.5 21.5 L12 17.5 L6.5 21.5 L8.5 15 L3 10.5 L10 10 Z" fill="#fff"/></svg>
          </span>
          <span class="fun" style="background:var(--sun)">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" fill="#fff"/><path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22 M4.5 4.5 L6.5 6.5 M17.5 17.5 L19.5 19.5 M4.5 19.5 L6.5 17.5 M17.5 6.5 L19.5 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
          </span>
          <span class="fun" style="background:var(--grass)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 3 C 7 3, 4 6, 4 10 C 4 15, 10 20, 12 21 C 14 20, 20 15, 20 10 C 20 6, 17 3, 12 3 Z" fill="#fff"/></svg>
          </span>
          <span class="fun" style="background:var(--sky)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 7 L12 3 L20 7 L20 17 L12 21 L4 17 Z" fill="#fff"/></svg>
          </span>
          <span class="fun" style="background:var(--violet)">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 4 H14 L18 8 V20 H6 Z" fill="#fff"/><path d="M14 4 V8 H18" stroke="#B084F3" stroke-width="1.6" fill="none"/></svg>
          </span>
        </div>
    </div>
  </section>
</div>


<script>
  // Password show/hide
  const pw = document.getElementById('password');
  const toggle = document.getElementById('toggle-pw');
  const eye = document.getElementById('eye');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    // swap eye for closed-eye
    if (show) {
      eye.innerHTML = '<path d="M3 4 L21 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2 12 C 5 6, 9 4, 12 4 C 13.5 4, 15 4.4, 16.3 5.1 M22 12 C 20.8 14.4, 19.2 16.2, 17.5 17.5 M8 8.5 C 5.5 10, 3.5 11.5, 2 12 C 5 18, 9 20, 12 20 C 13.2 20, 14.4 19.8, 15.5 19.4" stroke="currentColor" stroke-width="2" fill="none"/>';
    } else {
      eye.innerHTML = '<path d="M2 12 C 5 6, 9 4, 12 4 C 15 4, 19 6, 22 12 C 19 18, 15 20, 12 20 C 9 20, 5 18, 2 12 Z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" fill="currentColor"/>';
    }
  });

  // Tabs: Student / Parent
  const tabs = document.querySelectorAll('.tab');
  const helloSub = document.getElementById('hello-sub');
  const loginIdInput = document.getElementById('login-id');
  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.setAttribute('aria-selected', 'false'));
      t.setAttribute('aria-selected', 'true');
      const role = t.dataset.role;
      if (role === 'parent') {
        helloSub.textContent = "Keep an eye on your child's progress and rewards.";
        loginIdInput.placeholder = 'Mobile number or email';
      } else {
        helloSub.textContent = 'Sign in to keep learning and earning stars.';
        loginIdInput.placeholder = 'eg. sunny_8 or 98765 43210';
      }
    });
  });

  // Helper: turn raw login id into a friendly first name
  function prettyName(raw) {
    if (!raw) return 'friend';
    if (/^[0-9 +\-]+$/.test(raw)) return 'friend';
    return raw
      .replace(/[_.]+/g, ' ')
      .replace(/\b\w/g, c => c.toUpperCase())
      .trim()
      .split(/\s+/)[0] || 'friend';
  }

  // Login submit -> save name, then navigate to welcome.html
  const form = document.getElementById('form-student');
  const btn = form.querySelector('.btn');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }
    btn.innerHTML = 'Yay! Signing you in...';
    btn.style.background = 'var(--grass)';
    btn.style.boxShadow = '0 10px 0 -2px #2EA06E';
    const displayName = prettyName(loginIdInput.value.trim());
    try { localStorage.setItem('ls:user', displayName); } catch(e) {}
    setTimeout(() => { location.href = 'welcome.html'; }, 700);
  });

  // Forgot: friendly nudge rather than navigation
  const forgotEl = document.getElementById('forgot-link');
  forgotEl?.addEventListener('click', (e) => {
    e.preventDefault();
    forgotEl.animate([{transform:'translateY(0)'},{transform:'translateY(-4px)'},{transform:'translateY(0)'}], {duration: 320});
  });

  // GitHub buttons: friendly placeholder (real OAuth needs a backend)
  for (const id of ['github-login','github-signup']) {
    const el = document.getElementById(id);
    el?.addEventListener('click', () => {
      const original = el.innerHTML;
      el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" style="width:20px;height:20px"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="40 20"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"/></circle></svg> Connecting to GitHub...';
      el.disabled = true;
      setTimeout(() => { el.innerHTML = original; el.disabled = false; }, 1600);
    });
  }

  // View switching: login <-> signup
  const loginForm = document.getElementById('form-student');
  const signupForm = document.getElementById('form-signup');
  const tabsBar = document.querySelector('.tabs');
  const helloTitle = document.getElementById('hello-title');
  const signupLink = document.getElementById('signup-link');
  const backLink = document.getElementById('back-to-login');

  function showView(view) {
    const signup = view === 'signup';
    loginForm.hidden = signup;
    signupForm.hidden = !signup;
    tabsBar.hidden = signup;
    helloTitle.textContent = signup ? 'Create an account' : 'Welcome back!';
    helloSub.textContent = signup
      ? 'A few quick details and you can start learning.'
      : 'Sign in to keep learning and earning stars.';
    (signup ? document.getElementById('su-name') : document.getElementById('login-id')).focus({preventScroll:true});
  }
  signupLink?.addEventListener('click', (e) => { e.preventDefault(); showView('signup'); });
  backLink?.addEventListener('click', (e) => { e.preventDefault(); showView('login'); });

  // Password toggle for signup form
  const suPw = document.getElementById('su-password');
  const suToggle = document.getElementById('toggle-su-pw');
  const suEye = document.getElementById('su-eye');
  suToggle?.addEventListener('click', () => {
    const show = suPw.type === 'password';
    suPw.type = show ? 'text' : 'password';
    suToggle.setAttribute('aria-pressed', String(show));
    suToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    if (show) {
      suEye.innerHTML = '<path d="M3 4 L21 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M2 12 C 5 6, 9 4, 12 4 C 13.5 4, 15 4.4, 16.3 5.1 M22 12 C 20.8 14.4, 19.2 16.2, 17.5 17.5 M8 8.5 C 5.5 10, 3.5 11.5, 2 12 C 5 18, 9 20, 12 20 C 13.2 20, 14.4 19.8, 15.5 19.4" stroke="currentColor" stroke-width="2" fill="none"/>';
    } else {
      suEye.innerHTML = '<path d="M2 12 C 5 6, 9 4, 12 4 C 15 4, 19 6, 22 12 C 19 18, 15 20, 12 20 C 9 20, 5 18, 2 12 Z" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="12" cy="12" r="3" fill="currentColor"/>';
    }
  });

  // Signup submit -> save name, navigate to welcome.html
  const suBtn = signupForm.querySelector('.btn');
  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!signupForm.checkValidity()) {
      signupForm.reportValidity();
      return;
    }
    suBtn.innerHTML = 'Hooray! Account created';
    suBtn.style.background = 'var(--grass)';
    suBtn.style.boxShadow = '0 10px 0 -2px #2EA06E';
    const name = (document.getElementById('su-name').value.trim().split(/\s+/)[0]) || 'friend';
    try { localStorage.setItem('ls:user', name); } catch(e) {}
    setTimeout(() => { location.href = 'welcome.html'; }, 900);
  });
</script>

</body>
